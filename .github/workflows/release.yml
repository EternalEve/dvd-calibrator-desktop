name: Build release draft

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check tag matches project version
        run: |
          $version = ([xml](Get-Content -LiteralPath 'Directory.Build.props' -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw "Expected tag v$version, got $env:GITHUB_REF_NAME."
          }

      - name: Run regression tests
        run: ./tools/Test.ps1

      - name: Build and verify portable package
        run: |
          ./tools/Publish-Portable.ps1 -Out artifacts/release `
            -RuntimeSource 'https://api.nuget.org/v3/index.json'

      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $zip = "artifacts/release/DvdCalibrator-$version-win-x64.zip"
          gh release create $env:GITHUB_REF_NAME $zip "$zip.sha256" `
            --verify-tag --draft --generate-notes
